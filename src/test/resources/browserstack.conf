# BrowserStack Configuration
# Para ejecutar: mvn clean verify -Denvironment=browserstack -Dplatform=windows

serenity {
    take.screenshots = FOR_FAILURES
    take.screenshots = FOR_EACH_ACTION
    take.screenshots = AFTER_EACH_STEP
}

webdriver.base.url = "https://webx.muthematrix.com/"

# Configuración base de BrowserStack
# Las credenciales se inyectan desde variables de entorno / GitHub Secrets (nunca en texto plano)
browserstack {
  user = ${?BROWSERSTACK_USER}
  key = ${?BROWSERSTACK_KEY}
  local = false
  server = "hub-cloud.browserstack.com"
}

# Plataformas disponibles
platforms {
  # Windows 10 + Chrome Latest (Última versión)
  windows {
    webdriver {
      driver = remote
      # Usa BROWSERSTACK_URL si el workflow la inyecta; si no, la arma desde user + key
      remote.url = "https://"${?BROWSERSTACK_USER}":"${?BROWSERSTACK_KEY}"@hub-cloud.browserstack.com/wd/hub"
      remote.url = ${?BROWSERSTACK_URL}

      timeouts {
        implicitlywait = 15000
        pageload = 40000
      }

      capabilities {
        browserName = "Chrome"
        browserVersion = "latest"
        "bstack:options" {
          os = "Windows"
          osVersion = "10"
          projectName = "browserstack prueba dav"
          buildName = "browserstack prueba dav"
          sessionName = "Muthematrix Vote - Windows Chrome Latest"
          local = "false"
          debug = "true"
          networkLogs = "true"
          consoleLogs = "info"
          seleniumVersion = "4.0.0"
          timezone = "America/Bogota"
        }
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["remote-allow-origins=*", "test-type", "no-sandbox", "ignore-certificate-errors",
                  "start-maximized", "disable-infobars", "disable-gpu"]
          prefs {
            "profile.default_content_setting_values.geolocation" = 1
          }
        }
      }
    }
  }

  # macOS Monterey + Safari 15.6
  mac {
    webdriver {
      driver = remote
      # Usa BROWSERSTACK_URL si el workflow la inyecta; si no, la arma desde user + key
      remote.url = "https://"${?BROWSERSTACK_USER}":"${?BROWSERSTACK_KEY}"@hub-cloud.browserstack.com/wd/hub"
      remote.url = ${?BROWSERSTACK_URL}

      timeouts {
        implicitlywait = 15000
        pageload = 40000
      }

      capabilities {
        browserName = "Safari"
        browserVersion = "15.6"
        "bstack:options" {
          os = "OS X"
          osVersion = "Monterey"
          projectName = "browserstack prueba dav"
          buildName = "browserstack prueba dav"
          sessionName = "Muthematrix Vote - Mac Safari"
          local = "false"
          debug = "true"
          networkLogs = "true"
          consoleLogs = "info"
          seleniumVersion = "4.0.0"
          timezone = "America/Bogota"
        }
        acceptInsecureCerts = true
      }
    }
  }

  # iPhone 13 + Chromium
  iphone {
    webdriver {
      driver = remote
      # Usa BROWSERSTACK_URL si el workflow la inyecta; si no, la arma desde user + key
      remote.url = "https://"${?BROWSERSTACK_USER}":"${?BROWSERSTACK_KEY}"@hub-cloud.browserstack.com/wd/hub"
      remote.url = ${?BROWSERSTACK_URL}

      timeouts {
        implicitlywait = 20000
        pageload = 50000
      }

      capabilities {
        browserName = "chrome"
        "bstack:options" {
          deviceName = "iPhone 13"
          osVersion = "15"
          realMobile = "true"
          deviceOrientation = "portrait"
          projectName = "browserstack prueba dav"
          buildName = "browserstack prueba dav"
          sessionName = "Muthematrix Vote - iPhone 13"
          local = "false"
          debug = "true"
          networkLogs = "true"
          consoleLogs = "info"
          timezone = "America/Bogota"
        }
        acceptInsecureCerts = true
      }
    }
  }
}

